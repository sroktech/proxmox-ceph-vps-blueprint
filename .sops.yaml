---
# encrypted_regex keeps KEY NAMES readable in Git so a diff shows WHICH secret
# changed without revealing the value. Very useful during review.
creation_rules:
  - path_regex: secrets\.sops\.ya?ml$
    age: >-
      age1REPLACE_WITH_OPERATOR_PUBLIC_KEY,
      age1REPLACE_WITH_CI_PUBLIC_KEY
    encrypted_regex: '^(.*password.*|.*secret.*|.*token.*|.*key.*|.*passphrase.*)$'

  - path_regex: ansible/.*\.sops\.ya?ml$
    age: >-
      age1REPLACE_WITH_OPERATOR_PUBLIC_KEY,
      age1REPLACE_WITH_CI_PUBLIC_KEY
    encrypted_regex: '^(.*password.*|.*secret.*|.*token.*|.*key.*|.*passphrase.*)$'

  - path_regex: terraform/.*\.sops\.ya?ml$
    age: >-
      age1REPLACE_WITH_OPERATOR_PUBLIC_KEY,
      age1REPLACE_WITH_CI_PUBLIC_KEY
