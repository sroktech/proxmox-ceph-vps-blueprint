# Rocky Linux 10 kickstart for Packer builds.
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --activate --hostname=packer-build

# Root locked; build user only, removed in cleanup.
rootpw --lock
user --name=packerbuild --groups=wheel --password=$6$rounds=4096$REPLACE$THIS$HASH --iscrypted
sshkey --username=packerbuild "REPLACE_WITH_BUILD_SSH_PUBLIC_KEY"

bootloader --location=mbr --append="console=tty0 console=ttyS0,115200n8"
clearpart --all --initlabel
autopart --type=plain --nohome
firstboot --disabled
selinux --enforcing
firewall --enabled --service=ssh
skipx
reboot

%packages --excludedocs
@^minimal-environment
qemu-guest-agent
cloud-init
cloud-utils-growpart
openssh-server
sudo
-plymouth
%end

%post --erroronfail
echo 'packerbuild ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/packerbuild
chmod 440 /etc/sudoers.d/packerbuild
systemctl enable qemu-guest-agent
systemctl enable cloud-init
%end
