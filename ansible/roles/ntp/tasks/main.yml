---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Disable systemd-timesyncd if present
  ansible.builtin.service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  failed_when: false

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
    validate: "chronyd -Q -f %s"
  notify: restart chrony

- name: Ensure chrony running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
