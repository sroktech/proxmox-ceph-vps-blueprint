---
- name: Refuse to lock ourselves out
  ansible.builtin.assert:
    that:
      - ssh_authorized_keys | length > 0
    fail_msg: >-
      ssh_authorized_keys is empty. Disabling password auth without a key
      would make this node unreachable. Populate it before running.

- name: Ensure /root/.ssh exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Install authorized keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ ssh_authorized_keys }}"

- name: Deploy sshd hardening drop-in
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: reload sshd
