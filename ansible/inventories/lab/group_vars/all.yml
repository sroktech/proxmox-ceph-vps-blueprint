---
# LEARNING LAB. Same variable names as inventories/prod so the roles and
# playbooks run unmodified — only the values are scaled down for one
# physical mini PC running three nested Proxmox VMs.

ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/id_ed25519_pvps_lab

org_name: "Lab"
dns_domain: lab.local

# --- Networks (internal-only bridges on the physical host) ---
net_mgmt:            "10.20.10.0/24"
net_corosync_ring0:  "10.20.20.0/24"
net_corosync_ring1:  "10.20.21.0/24"
net_ceph_public:     "10.20.30.0/24"
net_ceph_cluster:    "10.20.31.0/24"
net_vxlan_underlay:  "10.20.40.0/24"
net_ipmi:            "10.20.99.0/24"
net_vpn:             "10.20.0.0/24"

# --- NTP ---
ntp_servers:
  - 0.debian.pool.ntp.org
  - 1.debian.pool.ntp.org
ntp_allow_networks: []

# --- SSH ---
ssh_permit_root_login: "prohibit-password"
ssh_password_authentication: "no"
ssh_max_auth_tries: 3
ssh_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA_REPLACE_ME lab@example"

# --- Monitoring ---
node_exporter_version: "1.8.2"
node_exporter_port: 9100
prometheus_scrape_networks:
  - "10.20.10.0/24"

# --- ZFS (small: nested VMs have little RAM to spare) ---
zfs_arc_max_bytes: 536870912    # 512 MiB
zfs_arc_min_bytes: 268435456    # 256 MiB

# --- Ceph (small OSD memory target: nested lab, not real capacity planning) ---
ceph_release: squid
ceph_osd_memory_target: 805306368   # 768 MiB — a real cluster must NOT use this value
ceph_pool_name: vm-disks
ceph_pool_size: 3
ceph_pool_min_size: 2

# --- Safety gates. Never default these to true. ---
allow_cluster_bootstrap: false
allow_ceph_bootstrap: false
allow_osd_create: false
allow_osd_destroy: false
