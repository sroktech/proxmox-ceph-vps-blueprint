---
# LEARNING LAB ONLY. Three nested Proxmox VMs running on ONE physical host
# (the mini PC). This does not exercise real hardware redundancy — all
# three "nodes" share one CPU, one set of DIMMs, one PSU, one NIC. Its
# purpose is to practice Ansible convergence, cluster/Ceph/SDN bootstrap
# procedures, and failure-test *mechanics* before real hardware exists.
# See docs/06 and docs/07 for what each step is actually verifying.
#
# All addresses below are internal-only bridges on the physical host
# (no uplink needed) except ansible_host, which should be reachable from
# wherever you run ansible-playbook from (bridged to your home LAN).
all:
  children:
    pve_nodes:
      hosts:
        pve-lab-01:
          ansible_host: 10.20.10.11          # REPLACE_ME: nested VM's mgmt IP
          pve_node_id: 1
          corosync_ring0_addr: 10.20.20.11
          corosync_ring1_addr: 10.20.21.11
          ceph_public_addr: 10.20.30.11
          ceph_cluster_addr: 10.20.31.11
          vxlan_underlay_addr: 10.20.40.11
          ceph_mon: true
          ceph_mgr: true
          sdn_exit_node: true
          ceph_osd_devices:
            - /dev/sdb
            - /dev/sdc
        pve-lab-02:
          ansible_host: 10.20.10.12          # REPLACE_ME
          pve_node_id: 2
          corosync_ring0_addr: 10.20.20.12
          corosync_ring1_addr: 10.20.21.12
          ceph_public_addr: 10.20.30.12
          ceph_cluster_addr: 10.20.31.12
          vxlan_underlay_addr: 10.20.40.12
          ceph_mon: true
          ceph_mgr: true
          sdn_exit_node: true
          ceph_osd_devices:
            - /dev/sdb
            - /dev/sdc
        pve-lab-03:
          ansible_host: 10.20.10.13          # REPLACE_ME
          pve_node_id: 3
          corosync_ring0_addr: 10.20.20.13
          corosync_ring1_addr: 10.20.21.13
          ceph_public_addr: 10.20.30.13
          ceph_cluster_addr: 10.20.31.13
          vxlan_underlay_addr: 10.20.40.13
          ceph_mon: true
          ceph_mgr: false
          sdn_exit_node: false
          ceph_osd_devices:
            - /dev/sdb
            - /dev/sdc
